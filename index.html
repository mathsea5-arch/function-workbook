<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>함수 워크북</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="lib/katex/katex.min.css">
<script src="lib/katex/katex.min.js"></script>
<script src="lib/katex/contrib/auto-render.min.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <nav class="tabs" id="tabs"></nav>
  <div class="spacer"></div>
  <div class="tools" id="tools">
    <button class="tool active" data-color="#1f2328" title="검정 펜"><span class="swatch" style="background:#1f2328"></span></button>
    <button class="tool" data-color="#1a5fd0" title="파랑 펜"><span class="swatch" style="background:#1a5fd0"></span></button>
    <button class="tool" data-color="#d93025" title="빨강 펜"><span class="swatch" style="background:#d93025"></span></button>
    <button class="tool" data-tool="eraser" title="지우개"><svg class="ico" viewBox="0 0 24 24"><path d="M15.6 3.6a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8L11 17.8H6.6l-3-3a2 2 0 0 1 0-2.8z" fill="#f4a7b9" stroke="#3c4043" stroke-width="1.6" stroke-linejoin="round"/><path d="M9.2 9.9l4.9 4.9" stroke="#3c4043" stroke-width="1.6"/><path d="M6.6 20.4h13" stroke="#3c4043" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <span class="sep"></span>
    <button class="tool size" data-size="0" title="가늘게"><span class="sdot"></span></button>
    <button class="tool size active" data-size="1" title="보통"><span class="sdot"></span></button>
    <button class="tool size" data-size="2" title="굵게"><span class="sdot"></span></button>
    <span class="sep"></span>
    <button class="tool" data-tool="undo" title="되돌리기" disabled><svg class="ico" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <button class="tool" data-tool="redo" title="다시 실행 (앞으로 가기)" disabled><svg class="ico" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>
    <button class="toggle" id="fingerBtn" title="켜면 손가락으로도 필기, 끄면 손가락은 화면 스크롤">✋ 끔</button>
  </div>
  <button class="toggle pdf" id="pdfBtn">📄 PDF</button>
  <span class="pill save" id="savePill">로그인 전</span>
</header>

<main class="wb" id="wb"></main>

<div class="overlay" id="login">
  <form class="dialog" id="loginForm">
    <h2>함수 워크북 시작하기</h2>
    <p>학번과 이름을 입력하세요. 필기는 이 태블릿에 저장돼요.</p>
    <div class="notice">📌 수업 중에 이 화면을 벗어나면(다른 앱·다른 탭·화면 끄기) <b>벗어난 시각과 시간이 선생님께 기록</b>됩니다.</div>
    <label class="field">수업 코드<input id="inClass" required autocomplete="off"></label>
    <label class="field">학번 (예: 10305)<input id="inNum" required inputmode="numeric" pattern="[0-9]{3,6}" autocomplete="off"></label>
    <label class="field">이름<input id="inName" required autocomplete="off"></label>
    <button class="primary" type="submit">시작</button>
  </form>
</div>

<div class="overlay hidden" id="pdfDlg">
  <div class="dialog">
    <h2>내 필기를 PDF로 저장</h2>
    <p>문제와 내가 쓴 필기가 함께 A4 PDF로 저장돼요.</p>
    <div id="pdfChoices">
      <button class="primary" data-scope="current">지금 보고 있는 Theme만</button>
      <button class="primary alt" data-scope="all">전체 (Theme 4개)</button>
      <button class="ghost" id="pdfCancel">닫기</button>
    </div>
    <div class="pdf-prog hidden" id="pdfProg"></div>
  </div>
</div>

<div class="banner hidden" id="banner"><span id="bannerText"></span><button id="bannerOk">확인</button></div>

<script src="lib/pdf/html2canvas.min.js"></script>
<script src="lib/pdf/jspdf.umd.min.js"></script>
<script src="js/config.js"></script>
<script src="js/workbook-data.js"></script>
<script src="js/backend.js"></script>
<script src="js/ink.js"></script>
<script src="js/student.js"></script>
</body>
</html>
