<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수업 현황판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">수업 현황판 · 화면 이탈 알림</div>
  <span class="pill" id="modePill"></span>
  <div class="spacer"></div>
  <label>수업 코드 <input class="code-in" id="cls"></label>
  <button class="ctl" id="connect">연결</button>
  <button class="ctl" id="sound">🔕 알림음 켜기</button>
  <button class="ctl danger" id="reset">기록 초기화</button>
</header>

<div class="dash">
  <section>
    <div class="howto hidden" id="demoHow">
      <b>데모 모드</b>입니다. 같은 브라우저에서 <b>새 창</b>으로 <a href="index.html" target="_blank">학생 페이지</a>를 열어 로그인한 뒤,
      그 창에서 다른 탭으로 가거나 창을 최소화해 보세요. 이 화면에 바로 표시됩니다. (실제 수업은 README의 Firebase 설정 후 사용)
    </div>
    <div class="summary" id="summary"></div>
    <div class="grid" id="grid"></div>
  </section>
  <aside class="panel">
    <h3>기록</h3>
    <ul class="log" id="log"></ul>
  </aside>
</div>
<div class="toasts" id="toasts"></div>

<script src="js/config.js"></script>
<script src="js/backend.js"></script>
<script src="js/teacher.js"></script>
</body>
</html>
